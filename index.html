<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Bar dos Bodes</title>
<style>
:root {
  --bg:#0d0d0d; --surface:#1a1a1a; --amber:#f59e0b;
  --text:#f5f5f5; --text2:#9ca3af; --success:#22c55e;
  --danger:#ef4444; --border:#2a2a2a;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;height:100dvh;overflow:hidden}
.screen{position:absolute;inset:0;display:none;flex-direction:column}
.screen.active{display:flex}

/* HEADER */
.hdr{background:var(--surface);padding:12px 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:2px solid var(--amber);flex-shrink:0}
.hdr h1{font-size:15px;font-weight:800;color:var(--amber);letter-spacing:2px}
.hdr-back{background:none;border:none;color:var(--text2);font-size:22px;cursor:pointer;padding:4px 10px}

/* HOME */
#home{justify-content:center;align-items:center;gap:28px;text-align:center;padding:32px 24px}
.logo-img{width:110px;height:110px;border-radius:18px;object-fit:contain}
.logo-title{font-size:26px;font-weight:900;color:var(--amber);letter-spacing:3px}
.logo-sub{color:var(--text2);font-size:13px}
.nfc-btn{background:var(--amber);color:#000;border:none;border-radius:50%;width:150px;height:150px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;box-shadow:0 0 32px rgba(245,158,11,.4);transition:transform .15s}
.nfc-btn:active{transform:scale(.93)}
.nfc-btn .icon{font-size:54px;line-height:1}
.nfc-btn .lbl{font-size:12px;font-weight:700;letter-spacing:1px}
.nfc-btn.scanning{animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 32px rgba(245,158,11,.4)}50%{box-shadow:0 0 56px rgba(245,158,11,.85)}}
.status{color:var(--text2);font-size:14px;min-height:18px}

/* REGISTER */
#register-screen{justify-content:center;align-items:center;padding:24px;gap:0}
.reg-box{background:var(--surface);border-radius:20px;padding:28px;width:100%;max-width:360px;border:1px solid var(--border)}
.reg-icon{font-size:48px;text-align:center;margin-bottom:8px}
.reg-title{font-size:20px;font-weight:800;color:var(--amber);text-align:center}
.reg-uid{font-size:11px;color:var(--text2);text-align:center;font-family:monospace;margin-top:4px;margin-bottom:22px}
.reg-lbl{font-size:11px;color:var(--text2);text-transform:uppercase;letter-spacing:.8px;margin-bottom:6px;font-weight:600}
.reg-input{width:100%;background:#222;border:1px solid var(--border);border-radius:10px;padding:14px;color:var(--text);font-size:17px;outline:none;margin-bottom:16px;text-align:center}
.reg-input:focus{border-color:var(--amber)}
.reg-btn{width:100%;background:var(--amber);color:#000;border:none;border-radius:10px;padding:16px;font-size:16px;font-weight:700;cursor:pointer;margin-bottom:10px}
.reg-btn:disabled{opacity:.5}
.reg-cancel{width:100%;background:none;border:1px solid var(--border);border-radius:10px;padding:14px;color:var(--text2);font-size:14px;cursor:pointer}

/* CARD */
#card-screen{flex-direction:column}
.card-info{background:var(--surface);margin:14px;border-radius:16px;padding:22px;border:1px solid var(--border);flex-shrink:0}
.card-name{font-size:26px;font-weight:800;color:var(--amber)}
.card-uid{font-size:11px;color:var(--text2);margin-top:3px;font-family:monospace}
.tab-row{display:flex;justify-content:space-between;align-items:flex-end;margin-top:18px;padding-top:18px;border-top:1px solid var(--border)}
.tab-label{color:var(--text2);font-size:13px}
.tab-val{font-size:30px;font-weight:900;color:var(--amber)}
.action-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:0 14px;flex-shrink:0}
.btn-consume{background:var(--amber);color:#000;border:none;border-radius:12px;padding:18px;font-size:16px;font-weight:700;cursor:pointer}
.btn-hist{background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:12px;padding:18px;font-size:15px;cursor:pointer}

/* BEVERAGES */
#bev-screen{flex-direction:column}
.bev-scroll{flex:1;overflow-y:auto;padding:12px}
.bev-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.bev-card{background:var(--surface);border-radius:12px;overflow:hidden;border:2px solid var(--border);cursor:pointer;transition:border-color .15s}
.bev-card:active{border-color:var(--amber)}
.bev-img{width:100%;aspect-ratio:1;object-fit:cover;background:#222;display:block}
.bev-ph{width:100%;aspect-ratio:1;background:#222;display:flex;align-items:center;justify-content:center;font-size:52px}
.bev-info{padding:10px}
.bev-nome{font-size:14px;font-weight:600}
.bev-preco{font-size:16px;font-weight:800;color:var(--amber);margin-top:3px}
.bev-stk{font-size:11px;color:var(--text2);margin-top:2px}

/* CONFIRM */
#confirm-screen{flex-direction:column}
.confirm-body{flex:1;padding:14px;overflow-y:auto;display:flex;flex-direction:column;gap:14px}
.confirm-card{background:var(--surface);border-radius:14px;padding:20px;border:1px solid var(--border)}
.confirm-lbl{font-size:11px;color:var(--text2);text-transform:uppercase;letter-spacing:1px;margin-bottom:6px}
.confirm-val{font-size:22px;font-weight:800;color:var(--amber)}
.confirm-rows{display:flex;flex-direction:column;gap:14px;margin-top:16px;padding-top:16px;border-top:1px solid var(--border)}
.cRow{display:flex;justify-content:space-between;align-items:center}
.cRow-l{color:var(--text2);font-size:14px}
.cRow-v{font-size:16px;font-weight:600}
.qty-ctl{display:flex;align-items:center;gap:14px;background:#2a2a2a;border-radius:10px;padding:8px 14px}
.qty-btn{background:var(--amber);color:#000;border:none;border-radius:6px;width:32px;height:32px;font-size:22px;font-weight:800;cursor:pointer;display:flex;align-items:center;justify-content:center}
.qty-num{font-size:20px;font-weight:800;min-width:28px;text-align:center}
.confirm-total{background:rgba(245,158,11,.1);border-radius:12px;padding:16px 20px;border:1px solid rgba(245,158,11,.3);display:flex;justify-content:space-between;align-items:center;flex-shrink:0}
.ct-label{color:var(--text2);font-size:14px}
.ct-val{font-size:26px;font-weight:900;color:var(--amber)}
.confirm-btns{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:14px;flex-shrink:0}
.btn-cancel{background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:12px;padding:18px;font-size:15px;cursor:pointer}
.btn-ok{background:var(--amber);color:#000;border:none;border-radius:12px;padding:18px;font-size:16px;font-weight:700;cursor:pointer}
.btn-ok:disabled{opacity:.5}

/* SUCCESS */
#success-screen{justify-content:center;align-items:center;text-align:center;gap:20px;padding:32px}
.suc-icon{font-size:72px}
.suc-title{font-size:24px;font-weight:800;color:var(--success)}
.suc-detail{color:var(--text2);font-size:15px}
.suc-tab{font-size:34px;font-weight:900;color:var(--amber)}
.suc-sub{color:var(--text2);font-size:13px;margin-top:-10px}
.suc-btn{background:var(--amber);color:#000;border:none;border-radius:12px;padding:18px 44px;font-size:16px;font-weight:700;cursor:pointer;margin-top:8px}

/* HISTORY */
#hist-screen{flex-direction:column}
.hist-list{flex:1;overflow-y:auto;padding:12px}
.hist-item{background:var(--surface);border-radius:10px;padding:14px 16px;margin-bottom:8px;border:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.hist-bev{font-size:15px;font-weight:600}
.hist-time{font-size:12px;color:var(--text2);margin-top:3px}
.hist-v{font-size:16px;font-weight:800;color:var(--amber)}
.hist-empty{text-align:center;color:var(--text2);padding:48px 24px;font-size:15px}

/* LOADER/TOAST */
.loader{position:fixed;inset:0;background:rgba(0,0,0,.8);display:none;align-items:center;justify-content:center;z-index:100;flex-direction:column;gap:14px}
.loader.on{display:flex}
.spinner{width:46px;height:46px;border:4px solid #333;border-top-color:var(--amber);border-radius:50%;animation:spin .75s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loader-txt{color:var(--text2);font-size:14px}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--surface);color:var(--text);padding:12px 24px;border-radius:10px;font-size:14px;border:1px solid var(--border);z-index:200;opacity:0;transition:opacity .3s;pointer-events:none;text-align:center;max-width:85vw}
.toast.on{opacity:1}
.toast.err{border-color:var(--danger);color:var(--danger)}
.toast.ok{border-color:var(--success);color:var(--success)}
</style>
</head>
<body>

<!-- HOME -->
<div class="screen active" id="home">
  <div style="display:flex;flex-direction:column;align-items:center;gap:10px">
    <img src="logo.png" class="logo-img" onerror="this.style.display='none'">
    <div class="logo-title">BAR DOS BODES</div>
    <div class="logo-sub">Sistema de Controle de Consumo</div>
  </div>
  <button class="nfc-btn" id="nfc-btn" onclick="startNFC()">
    <span class="icon">📡</span>
    <span class="lbl">INICIAR NFC</span>
  </button>
  <div class="status" id="status">Toque para ativar o NFC</div>
</div>

<!-- CADASTRAR NOVO CARTÃO -->
<div class="screen" id="register-screen">
  <div class="reg-box">
    <div class="reg-icon">🆕</div>
    <div class="reg-title">Cartão Novo</div>
    <div class="reg-uid" id="reg-uid"></div>
    <div class="reg-lbl">Nome do portador</div>
    <input class="reg-input" type="text" id="reg-nome" placeholder="Digite o nome..." autocomplete="off"
      onkeydown="if(event.key==='Enter')doRegister()">
    <button class="reg-btn" id="reg-btn" onclick="doRegister()">Cadastrar e Continuar ✓</button>
    <button class="reg-cancel" onclick="goHome()">Cancelar</button>
  </div>
</div>

<!-- CARTÃO -->
<div class="screen" id="card-screen">
  <div class="hdr">
    <button class="hdr-back" onclick="goHome()">←</button>
    <h1>BAR DOS BODES</h1>
    <span style="color:var(--text2);font-size:18px">🐐</span>
  </div>
  <div class="card-info">
    <div class="card-name" id="card-name">—</div>
    <div class="card-uid"  id="card-uid"></div>
    <div class="tab-row">
      <div>
        <div class="tab-label">Consumo acumulado</div>
        <div class="tab-val" id="card-tab">R$ 0,00</div>
      </div>
      <div style="font-size:42px">🍺</div>
    </div>
  </div>
  <div class="action-row">
    <button class="btn-consume" onclick="showBeverages()">🛒 Consumir</button>
    <button class="btn-hist"    onclick="showHistory()">📋 Histórico</button>
  </div>
</div>

<!-- BEBIDAS -->
<div class="screen" id="bev-screen">
  <div class="hdr">
    <button class="hdr-back" onclick="showScreen('card-screen')">←</button>
    <h1>ESCOLHA A BEBIDA</h1>
    <span style="color:var(--text2);font-size:13px" id="bev-hdr-nome"></span>
  </div>
  <div class="bev-scroll">
    <div class="bev-grid" id="bev-grid"></div>
  </div>
</div>

<!-- CONFIRMAR -->
<div class="screen" id="confirm-screen">
  <div class="hdr">
    <button class="hdr-back" onclick="showScreen('bev-screen')">←</button>
    <h1>CONFIRMAR</h1>
    <span></span>
  </div>
  <div class="confirm-body">
    <div class="confirm-card">
      <div class="confirm-lbl">Cartão</div>
      <div class="confirm-val" id="cf-nome"></div>
      <div class="confirm-rows">
        <div class="cRow"><span class="cRow-l">Bebida</span><span class="cRow-v" id="cf-bev"></span></div>
        <div class="cRow">
          <span class="cRow-l">Quantidade</span>
          <div class="qty-ctl">
            <button class="qty-btn" onclick="chgQty(-1)">−</button>
            <span class="qty-num" id="qty-num">1</span>
            <button class="qty-btn" onclick="chgQty(1)">+</button>
          </div>
        </div>
        <div class="cRow"><span class="cRow-l">Valor unitário</span><span class="cRow-v" id="cf-unit"></span></div>
      </div>
    </div>
  </div>
  <div class="confirm-total">
    <span class="ct-label">Total a lançar</span>
    <span class="ct-val" id="cf-total">R$ 0,00</span>
  </div>
  <div class="confirm-btns">
    <button class="btn-cancel" onclick="showScreen('bev-screen')">Cancelar</button>
    <button class="btn-ok" id="btn-ok" onclick="doConsume()">Confirmar ✓</button>
  </div>
</div>

<!-- SUCESSO -->
<div class="screen" id="success-screen">
  <div class="suc-icon">✅</div>
  <div class="suc-title">Lançado!</div>
  <div class="suc-detail" id="suc-detail"></div>
  <div class="suc-tab"    id="suc-tab"></div>
  <div class="suc-sub">consumo acumulado</div>
  <button class="suc-btn" onclick="goHome()">Nova leitura</button>
</div>

<!-- HISTÓRICO -->
<div class="screen" id="hist-screen">
  <div class="hdr">
    <button class="hdr-back" onclick="showScreen('card-screen')">←</button>
    <h1>HISTÓRICO</h1>
    <span style="color:var(--text2);font-size:13px" id="hist-hdr-nome"></span>
  </div>
  <div class="hist-list" id="hist-list"></div>
</div>

<div class="loader" id="loader"><div class="spinner"></div><div class="loader-txt" id="loader-txt">Aguarde…</div></div>
<div class="toast" id="toast"></div>

<script>
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxgn9N6tDTtVbPpAdjPMZjVgFB4RixrVmRSoiav9Yq-LYlb3QAd1criHB32GBVZJ_S3/exec';

let curCard = null, curBev = null, curQty = 1, allBevs = [];
let pendingUID = null; // UID do cartão novo aguardando cadastro

// ── SCREENS ──────────────────────────────────────────────
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}
function goHome() {
  curCard = null; curBev = null; curQty = 1; pendingUID = null;
  document.getElementById('nfc-btn').classList.remove('scanning');
  document.getElementById('status').textContent = 'Toque para ativar o NFC';
  showScreen('home');
}

// ── API ──────────────────────────────────────────────────
async function api(p) {
  const r = await fetch(SCRIPT_URL + '?' + new URLSearchParams(p));
  return r.json();
}
async function apiPost(data) {
  const r = await fetch(SCRIPT_URL, { method:'POST', headers:{'Content-Type':'text/plain'}, body:JSON.stringify(data) });
  return r.json();
}
function loading(on, txt) {
  document.getElementById('loader').classList.toggle('on', on);
  if (txt) document.getElementById('loader-txt').textContent = txt;
}
let _tt;
function showToast(msg, type) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast on' + (type ? ' ' + type : '');
  clearTimeout(_tt);
  _tt = setTimeout(() => el.classList.remove('on'), 3200);
}
function fmt(v) { return 'R$ ' + Number(v).toFixed(2).replace('.', ','); }

// ── NFC ──────────────────────────────────────────────────
async function startNFC() {
  if (!('NDEFReader' in window)) {
    showToast('NFC não suportado — use Chrome no Android', 'err'); return;
  }
  const btn = document.getElementById('nfc-btn');
  btn.classList.add('scanning');
  document.getElementById('status').textContent = 'Aguardando cartão…';
  try {
    const ndef = new NDEFReader();
    await ndef.scan();
    ndef.onreadingerror = () => showToast('Erro ao ler cartão', 'err');
    ndef.onreading = async (ev) => {
      const uid = ev.serialNumber.replace(/:/g, '').toUpperCase();
      btn.classList.remove('scanning');
      await handleCard(uid);
    };
  } catch(e) {
    btn.classList.remove('scanning');
    document.getElementById('status').textContent = 'Toque para ativar o NFC';
    showToast('Permissão NFC negada — verifique as configurações do site', 'err');
  }
}

async function handleCard(uid) {
  loading(true, 'Buscando cartão…');
  try {
    const res = await api({ action: 'getCard', uid });
    loading(false);
    if (res.found) {
      // Cartão já cadastrado — vai direto
      curCard = res;
      document.getElementById('card-name').textContent = res.nome;
      document.getElementById('card-uid').textContent  = 'UID: ' + res.uid;
      document.getElementById('card-tab').textContent  = fmt(res.tabTotal);
      showScreen('card-screen');
    } else {
      // Cartão novo — abre tela de cadastro
      pendingUID = uid;
      document.getElementById('reg-uid').textContent = 'UID: ' + uid;
      document.getElementById('reg-nome').value = '';
      showScreen('register-screen');
      setTimeout(() => document.getElementById('reg-nome').focus(), 200);
    }
  } catch(e) {
    loading(false);
    showToast('Erro de conexão', 'err');
  }
}

// ── CADASTRO PELO CELULAR ────────────────────────────────
async function doRegister() {
  const nome = document.getElementById('reg-nome').value.trim();
  if (!nome) { showToast('Digite o nome do portador', 'err'); return; }
  const btn = document.getElementById('reg-btn');
  btn.disabled = true;
  loading(true, 'Cadastrando cartão…');
  try {
    const res = await apiPost({ action: 'registerCard', uid: pendingUID, nome });
    loading(false);
    btn.disabled = false;
    if (res.success) {
      curCard = { uid: pendingUID, nome, tabTotal: 0 };
      document.getElementById('card-name').textContent = nome;
      document.getElementById('card-uid').textContent  = 'UID: ' + pendingUID;
      document.getElementById('card-tab').textContent  = fmt(0);
      showScreen('card-screen');
      showToast('Cartão cadastrado com sucesso!', 'ok');
    } else {
      showToast(res.error || 'Erro ao cadastrar', 'err');
    }
  } catch(e) {
    loading(false);
    btn.disabled = false;
    showToast('Erro de conexão', 'err');
  }
}

// ── BEBIDAS ──────────────────────────────────────────────
async function showBeverages() {
  loading(true, 'Carregando bebidas…');
  try {
    const res = await api({ action: 'getBeverages' });
    loading(false);
    allBevs = res.beverages || [];
    document.getElementById('bev-hdr-nome').textContent = curCard.nome;
    const grid = document.getElementById('bev-grid');
    if (!allBevs.length) {
      grid.innerHTML = '<div style="grid-column:1/-1;text-align:center;color:var(--text2);padding:40px">Nenhuma bebida cadastrada</div>';
    } else {
      grid.innerHTML = allBevs.map(b => `
        <div class="bev-card" onclick="selectBev(${b.id})">
          ${b.fotoUrl ? `<img class="bev-img" src="${b.fotoUrl}" loading="lazy" onerror="this.style.display='none'">` : `<div class="bev-ph">🍺</div>`}
          <div class="bev-info">
            <div class="bev-nome">${b.nome}</div>
            <div class="bev-preco">${fmt(b.precoVenda)}</div>
            <div class="bev-stk">Estoque: ${b.estoque}</div>
          </div>
        </div>`).join('');
    }
    showScreen('bev-screen');
  } catch(e) {
    loading(false);
    showToast('Erro ao carregar bebidas', 'err');
  }
}

function selectBev(id) {
  curBev = allBevs.find(b => b.id == id); if (!curBev) return;
  curQty = 1;
  document.getElementById('cf-nome').textContent  = curCard.nome;
  document.getElementById('cf-bev').textContent   = curBev.nome;
  document.getElementById('cf-unit').textContent  = fmt(curBev.precoVenda);
  document.getElementById('qty-num').textContent  = 1;
  document.getElementById('cf-total').textContent = fmt(curBev.precoVenda);
  showScreen('confirm-screen');
}

function chgQty(d) {
  curQty = Math.max(1, curQty + d);
  document.getElementById('qty-num').textContent  = curQty;
  document.getElementById('cf-total').textContent = fmt(curBev.precoVenda * curQty);
}

// ── CONSUMO ──────────────────────────────────────────────
async function doConsume() {
  const btn = document.getElementById('btn-ok');
  btn.disabled = true;
  loading(true, 'Lançando…');
  try {
    const res = await apiPost({ action:'consume', uid:curCard.uid, beverageId:curBev.id, qty:curQty });
    loading(false); btn.disabled = false;
    if (!res.success) { showToast(res.error || 'Erro ao lançar', 'err'); return; }
    document.getElementById('suc-detail').textContent = `${curQty}× ${curBev.nome}  •  ${fmt(curBev.precoVenda * curQty)}`;
    document.getElementById('suc-tab').textContent    = fmt(res.card.tabTotal);
    showScreen('success-screen');
  } catch(e) {
    loading(false); btn.disabled = false;
    showToast('Erro de conexão', 'err');
  }
}

// ── HISTÓRICO ────────────────────────────────────────────
async function showHistory() {
  loading(true, 'Carregando histórico…');
  try {
    const res = await api({ action:'getTransactions', uid:curCard.uid });
    loading(false);
    document.getElementById('hist-hdr-nome').textContent = curCard.nome;
    const trans = (res.transactions || []).reverse();
    const list  = document.getElementById('hist-list');
    list.innerHTML = trans.length
      ? trans.map(t => `
          <div class="hist-item">
            <div>
              <div class="hist-bev">${t.bebida}</div>
              <div class="hist-time">${t.data} às ${t.hora} &nbsp;·&nbsp; ${t.quantidade}×</div>
            </div>
            <div class="hist-v">${fmt(t.valorTotal)}</div>
          </div>`).join('')
      : '<div class="hist-empty">Nenhum consumo registrado ainda</div>';
    showScreen('hist-screen');
  } catch(e) {
    loading(false);
    showToast('Erro ao carregar histórico', 'err');
  }
}
</script>
